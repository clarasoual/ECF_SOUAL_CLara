services:

  # Serveur Apache + PHP
  php:
    build: .
    container_name: ecoride_php
    ports:
      - "8080:80"
    volumes:
      - ./PROJET:/var/www/html
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_NAME=eco_ride
      - DB_USER=root
      - DB_PASS=root

  # Base de données MySQL
  mysql:
    image: mysql:8.0
    container_name: ecoride_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eco_ride
    volumes:
      - mysql_data:/var/lib/mysql

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecoride_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data: